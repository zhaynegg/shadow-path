<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#cccccc" />
    <meta name="description" content="Walk Astana in the shade — or in the sun. Routes weighted by where buildings and trees actually cast shadow, hour by hour." />
    <!-- Day or Night, decided before anything is drawn. Left to React, the page
         would paint Day first and then flash to Night for anyone whose device
         is dark. The same rule as pickTheme in src/lib/theme.ts, and the same
         storage key: a stored choice wins, otherwise follow the device. -->
    <script>
      (function () {
        var stored = null
        try { stored = localStorage.getItem('shadow-path-theme') } catch (e) {}
        var night = stored === 'night' || stored === 'light'
          ? stored === 'night'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = night ? 'night' : 'light'
        if (night) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141414')
      })()
    </script>
    <!-- Inter, with the system stack behind it in index.css: if this never
         arrives the page is still typeset, only in the platform's own face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&display=swap" />
    <title>Shadow Path — Astana</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
