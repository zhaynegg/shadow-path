# The fast check: does the code compile, lint and pass its tests.
#
# Deliberately separate from shadow-tiles.yml, which builds tippecanoe from
# source and spends an hour on geometry. Nothing here touches the tiles, the
# graph or the imagery -- this has to be quick enough to run on every push, or
# it stops being read.
name: CI

on:
  push:
  pull_request:

# A push that supersedes another makes the earlier answer irrelevant, so cancel
# it. The opposite of the tile build, which must never cancel: two runs there
# would be two jobs writing the same directory, and a half-finished tileset is
# worse than a late one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # Same pin as the tile workflow, and for the same reason: setup-uv
      # publishes no bare major tag, and an action that changes underneath you
      # unannounced is the hardest kind of CI failure to read.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # --frozen fails rather than quietly resolving something new, so this
      # builds the dependency set in uv.lock or nothing. Unlike the tile build
      # there is no --no-dev: pytest and ruff are the dev group, and they are
      # the entire point of this job. The Python version comes from
      # backend/.python-version.
      - name: Install dependencies
        run: uv sync --frozen

      # Lint before tests. It is seconds against a minute, and a failure here
      # is usually a one-line fix, so finding it first is finding it cheapest.
      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the machine this is developed on. Bump both together.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly what package-lock.json says and
      # fails if the lockfile and package.json disagree, which is the whole
      # reason a lockfile is committed.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Last because it is the slowest, and it subsumes the typecheck -- the
      # build script is `tsc -b && vite build`. Bundling is worth doing here
      # rather than only typechecking: tsc will not notice an import that
      # resolves in the editor and not in the bundler.
      - name: Build
        run: npm run build

# What this does not cover, so nobody reads a green tick for more than it says:
# the tile export never runs, and neither does a real route. test_api.py checks
# what a caller may ask for and what gets cached, but stands the expensive calls
# aside -- pulling the graph and the footprints off disk is minutes warm and a
# failure cold. Nothing here proves the pieces fit together with a real graph
# in them. See "Known gaps" in the README.
