# Rebuilds the shadow tiles for the current date.
#
# Shadow length depends on the day of the year, not just the hour: an Astana
# noon shadow is 0.55x the building's height in June and 3.8x in December. Tiles
# built once go stale by about 1.5% a day near the equinoxes, so they are rebuilt
# nightly rather than pinned to a date.
#
# The result is published twice: as a workflow artifact, which is the record of
# what a run produced, and as a rolling "tiles-latest" release, which is what
# the two Render services pull from at build time. See render.yaml.
name: Shadow tiles

on:
  schedule:
    # 19:00 UTC is midnight in Astana (UTC+5), so a run lands at the start of the
    # day it is building for. Two things to know about GitHub's scheduler: runs
    # are often late under load, sometimes by 10+ minutes, and a schedule is
    # disabled automatically after 60 days with no commits to the repository.
    - cron: "0 19 * * *"

  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to build for (blank = today in Astana)"
        required: false
        type: string

# One run at a time. Nothing here is fast, and a manual run started during a
# scheduled one would have two jobs writing the same directory.
concurrency:
  group: shadow-tiles
  cancel-in-progress: false

# Writing a release, and nothing else.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Was 45 when a date meant 13 hourly tilesets. Low-sun hours are now cut
    # into thirds, which takes mid-September to 24 stamps and midsummer to 29.
    # Cost is per stamp and roughly flat -- 33-43s each locally, and the low-sun
    # ones are if anything the cheaper end -- so this scales with the count.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # tippecanoe is not in the Ubuntu repositories, so it is built from
      # source. Installing into ~/.local keeps it somewhere the runner user owns
      # and can therefore restore a cache into -- /usr/local/bin is root's.
      - name: Restore tippecanoe
        id: tippecanoe
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/tippecanoe
          # Bump this suffix to rebuild against a newer tippecanoe. Until then
          # the cache is also what pins the version, which is the behaviour you
          # want from something that shapes every tile you ship.
          key: tippecanoe-v1-${{ runner.os }}

      - name: Build tippecanoe
        if: steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          make -C /tmp/tippecanoe install PREFIX="$HOME/.local"

      # Runs on a cache hit too, and has to be its own step: PATH written to
      # GITHUB_PATH only takes effect in the steps that follow.
      - name: Put tippecanoe on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Pinned to a full version, not a major: setup-uv does not publish a
      # bare v10 tag the way actions/* do, and a nightly job is the last place
      # you want an action changing underneath you unannounced.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # --frozen fails rather than quietly resolving something new, so CI builds
      # the dependency set in uv.lock or nothing. --no-dev leaves out pytest,
      # ruff and scipy, none of which the export touches.
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --no-dev

      # The date goes through the environment rather than into the run: block.
      # A workflow_dispatch input interpolated straight into a shell command is
      # a script-injection hole -- whatever is typed in the box gets run.
      - name: Build the tiles
        working-directory: backend
        env:
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$DATE" ]; then
            uv run python scripts/export_shadow_tiles.py --date "$DATE"
          else
            uv run python scripts/export_shadow_tiles.py
          fi

      # The manifest is the whole record of what a run produced. Printing it
      # means a failure weeks from now can be read off the log.
      - name: Show what was built
        run: cat frontend/public/shadows/index.json

      - name: Upload the tiles
        uses: actions/upload-artifact@v7
        with:
          name: shadow-tiles
          # The routing scores ride along: the run computes them from the same
          # shadow field it cuts the tiles from, and uploading only half of
          # what it built would leave the expensive half on the runner.
          path: |
            frontend/public/shadows/
            data/cache/scored/
          # These are rebuilt nightly, so keeping a fortnight of them would
          # only be storage -- and a day is no longer 59 MB. See the tile-size
          # note in the README. The release below is what actually gets served;
          # this copy is the record of the run that produced it.
          retention-days: 7

      # --- publish, for the two Render services to pull from ----------------
      #
      # A release rather than the artifact above, because an artifact needs an
      # authenticated API call and a run id to fetch, while a release asset has
      # a stable public URL that a build command can curl. One rolling tag,
      # replaced each night: the tiles describe one day, and yesterday's are of
      # no use to anybody once today's exist.
      - name: Pack
        run: |
          tar -czf shadows.tar.gz -C frontend/public/shadows .
          tar -czf scored.tar.gz -C data/cache/scored .
          ls -lh shadows.tar.gz scored.tar.gz

      - name: Publish as the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tiles-latest --yes --cleanup-tag || true
          gh release create tiles-latest shadows.tar.gz scored.tar.gz \
            --title "Shadow tiles, $(date -u +%Y-%m-%d)" \
            --notes "Rebuilt nightly by .github/workflows/shadow-tiles.yml. \
          Pulled at build time by both services in render.yaml."

      # Render does not watch the release, so it has to be told. Both hooks are
      # optional: without them the workflow still publishes, and the site picks
      # the new tiles up at whatever deploy happens next.
      - name: Ask Render to redeploy
        env:
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          for hook in "$API_HOOK" "$WEB_HOOK"; do
            if [ -n "$hook" ]; then curl -fsS -X POST "$hook" >/dev/null && echo "  triggered"; fi
          done
          if [ -z "$API_HOOK$WEB_HOOK" ]; then
            echo "no deploy hooks configured -- see render.yaml"
          fi
